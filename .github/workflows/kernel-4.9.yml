name: kernel-4.9 bring-up

on:
  workflow_dispatch:
  push:
    branches:
      - kernel-4.9
    paths:
      - ".github/workflows/kernel-4.9.yml"
      - "kernel-4.9/**"
      - "scripts/kernel-4.9-*"
      - "scripts/prepare-kernel-4.9.sh"
      - "scripts/mtk-drvgen-wrapper.sh"

permissions:
  contents: read

concurrency:
  group: kernel-4.9-bringup
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.profile }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: reference
            fragment: ""
          - profile: minimal
            fragment: kernel-4.9/configs/a32_minimal.fragment

    env:
      A32_KERNEL49_JOBS: "2"
      A32_KERNEL49_VERBOSE: "1"
      A32_KERNEL49_FRAGMENT: ${{ matrix.fragment }}

    steps:
      - name: Checkout A32 OS
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils \
            bison \
            build-essential \
            file \
            flex \
            libc6:i386 \
            libc6-i386 \
            libssl-dev \
            perl \
            python-is-python3

      - name: Fetch Android GCC 4.9 cross toolchain
        shell: bash
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/arm-linux-androideabi-4.9"
          git clone --depth 1 --single-branch --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "$TOOLCHAIN"
          echo "A32_CROSS_COMPILE=$TOOLCHAIN/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/arm-linux-androideabi-gcc" --version | head -n 1

      - name: Fetch pinned MediaTek Linux 4.9 tree
        run: bash scripts/prepare-kernel-4.9.sh

      - name: Host preflight
        run: bash scripts/kernel-4.9-preflight.sh

      - name: Board hardware audit
        run: bash scripts/kernel-4.9-board-audit.sh

      - name: Build zImage-dtb
        id: kernel
        shell: bash
        run: |
          set +e
          bash scripts/build-kernel-4.9.sh
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          mkdir -p target/kernel-4.9
          echo "$status" > target/kernel-4.9/build.status
          exit 0

      - name: Summarize failure
        if: steps.kernel.outputs.status != '0'
        shell: bash
        run: |
          echo "## Linux 4.9 ${{ matrix.profile }} build failed" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          printf 'Exit status: `%s`\n' "$(cat target/kernel-4.9/build.status 2>/dev/null || echo unknown)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f target/kernel-4.9/build.log ]]; then
            tail -n 120 target/kernel-4.9/build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "target/kernel-4.9/build.log was not created" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-4.9-${{ matrix.profile }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            target/kernel-4.9/build.log
            target/kernel-4.9/build.status
            target/kernel-4.9/build/.config
            target/kernel-4.9/zImage-dtb

      - name: Fail job when kernel build failed
        if: steps.kernel.outputs.status != '0'
        run: exit 1
