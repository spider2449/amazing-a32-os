name: kernel-4.9 bring-up

on:
  workflow_dispatch:
  push:
    branches:
      - kernel-4.9
    paths:
      - ".github/workflows/kernel-4.9.yml"
      - "kernel-4.9/**"
      - "scripts/kernel-4.9-*"
      - "scripts/prepare-kernel-4.9.sh"
      - "scripts/mtk-drvgen-wrapper.sh"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      A32_CROSS_COMPILE: arm-linux-gnueabihf-
      A32_KERNEL49_JOBS: "2"

    steps:
      - name: Checkout A32 OS
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils \
            bison \
            build-essential \
            file \
            flex \
            gcc-arm-linux-gnueabihf \
            libc6:i386 \
            libc6-i386 \
            libssl-dev \
            perl

      - name: Fetch pinned MediaTek Linux 4.9 tree
        run: bash scripts/prepare-kernel-4.9.sh

      - name: Host preflight
        run: bash scripts/kernel-4.9-preflight.sh

      - name: Build zImage-dtb
        id: kernel
        shell: bash
        run: |
          set +e
          bash scripts/build-kernel-4.9.sh
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize failure
        if: steps.kernel.outputs.status != '0'
        shell: bash
        run: |
          echo "## Linux 4.9 build failed" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Exit status: `\${{ steps.kernel.outputs.status }}`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f target/kernel-4.9/build.log ]]; then
            tail -n 120 target/kernel-4.9/build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "target/kernel-4.9/build.log was not created" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-4.9-diagnostics
          if-no-files-found: ignore
          path: |
            target/kernel-4.9/build.log
            target/kernel-4.9/build/.config
            target/kernel-4.9/zImage-dtb

      - name: Fail job when kernel build failed
        if: steps.kernel.outputs.status != '0'
        run: exit 1
